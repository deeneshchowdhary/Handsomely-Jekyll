#Theme Name: Handsomely
#CMS - Jekyll
#Developer- Deenesh Chowdhary
#http://deeneshchowdhary.com

title: Handsomely
description: "A polished, editorial-style Jekyll theme for thoughtful writing."
email: your-email@domain.com
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
email_username: your-email@domain.com #Your email address
twitter_username: "" #Twitter Username goes here
github_username: deeneshchowdhary #Github Username goes here
facebook_username: "" #Facebook Username goes here
your_name: Handsomely Pencil #Your Name for About
about_yourself: "A refined, responsive Jekyll theme with a clean editorial layout, thoughtful typography, and modern styling for personal blogs and portfolios." # Brief description about yourself
copyright_name: Handsomely #Copyright

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
paginate: 5 #Total Number of Post in each Page
paginate_path: /page:num/
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
